<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carbon Prediction App</title>
    <style>
        *{
              margin:0;
              padding:0;
              box-sizing:border-box;
              font-family:'Segoe UI',sans-serif;
          }

          body{
              min-height:100vh;

              background:
                  linear-gradient(rgba(3,18,8,0.78), rgba(3,18,8,0.88)),
                  url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80');

              background-size:cover;
              background-position:center;
              color:white;
              overflow-x:hidden;
          }

          /* NAVBAR */

          .navbar{
              width:100%;
              padding:18px 40px;

              display:flex;
              justify-content:space-between;
              align-items:center;

              background:rgba(255,255,255,0.08);
              backdrop-filter:blur(12px);

              border-bottom:1px solid rgba(255,255,255,0.08);
          }

          .navbar h1{
              color:#baffc9;
              font-size:30px;
              font-weight:700;
          }

          .nav-links{
              display:flex;
              gap:25px;
          }

          .nav-link{
              text-decoration:none;
              color:white;
              font-weight:500;
              transition:0.3s;
          }

          .nav-link:hover{
              color:#8dffb2;
          }

          /* MAIN CONTAINER */

          .container{
              width:100%;
              padding:40px;
          }

          /* PAGE TITLE */

          .page-title{
              text-align:center;
              margin-bottom:35px;
          }

          .page-title h2{
              font-size:42px;
              color:#d9ffe1;
              margin-bottom:10px;
          }

          .page-title p{
              color:#d8d8d8;
              font-size:16px;
          }

          /* GRID */

          .grid{
              display:grid;
              grid-template-columns:420px 1fr;
              gap:30px;
              align-items:start;
          }

          /* GLASS CARD */

          .card{
              background:rgba(255,255,255,0.08);
              backdrop-filter:blur(14px);

              border:1px solid rgba(255,255,255,0.08);
              border-radius:24px;

              padding:30px;

              box-shadow:0 8px 30px rgba(0,0,0,0.25);
          }

          .card h3{
              margin-bottom:25px;
              color:#baffc6;
              font-size:24px;
          }

          /* FORM */

          .form-group{
              margin-bottom:20px;
          }

          label{
              display:block;
              margin-bottom:8px;
              color:#e8ffe8;
              font-size:14px;
          }

          input,
          select{
              width:100%;
              padding:14px;

              border:none;
              outline:none;

              border-radius:12px;

              background:rgba(255,255,255,0.12);
              color:white;

              font-size:15px;
          }

          input::placeholder{
              color:#ddd;
          }

          select{
              min-height:130px;
          }

          option{
              color:black;
          }

          /* BUTTON */

          button{
              width:100%;
              padding:14px;

              border:none;
              border-radius:14px;

              background:linear-gradient(135deg,#67ff9a,#148a45);

              color:white;
              font-size:16px;
              font-weight:600;

              cursor:pointer;
              transition:0.3s;
          }

          button:hover{
              transform:translateY(-3px);
              box-shadow:0 10px 20px rgba(0,0,0,0.25);
          }

          /* TABLE */

          .table-wrapper{
              overflow-x:auto;
          }

          table{
              width:100%;
              border-collapse:collapse;
          }

          thead{
              background:rgba(255,255,255,0.08);
          }

          th{
              padding:18px;
              text-align:left;
              color:#bbffcb;
              font-size:15px;
          }

          td{
              padding:18px;
              border-top:1px solid rgba(255,255,255,0.08);
              color:#f3f3f3;
          }

          tbody tr{
              transition:0.3s;
          }

          tbody tr:hover{
              background:rgba(255,255,255,0.05);
          }

          /* ROLE TAGS */

          .roles span{
              display:inline-block;
              padding:7px 14px;
              margin:4px;

              border-radius:30px;

              background:rgba(111,255,163,0.15);
              color:#a8ffbd;

              font-size:13px;
              font-weight:600;
          }

          /* STATS */

          .stats{
              display:grid;
              grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
              gap:20px;
              margin-bottom:30px;
          }

          .stat-card{
              background:rgba(255,255,255,0.08);
              backdrop-filter:blur(10px);

              border-radius:18px;
              padding:24px;

              border:1px solid rgba(255,255,255,0.08);
          }

          .stat-card h4{
              color:#baffc7;
              margin-bottom:10px;
          }

          .stat-card .number{
              font-size:32px;
              font-weight:bold;
          }

          /* RESPONSIVE */

          @media(max-width:950px){

              .grid{
                  grid-template-columns:1fr;
              }

              .navbar{
                  flex-direction:column;
                  gap:15px;
                  text-align:center;
              }

              .container{
                  padding:20px;
              }
          }

    </style>

</head>

<body>

<!-- NAVBAR -->

<header class="navbar">

    <h1>🌿 Carbon User Management</h1>

    <nav class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/admin" class="nav-link">Dashboard</a>
        <a href="/login" class="nav-link">Logout</a>
    </nav>

</header>

<!-- MAIN -->

<div class="container">

    <!-- TITLE -->

    <div class="page-title">

        <h2> User Management Dashboard</h2>

        <p>
            Manage platform users and assign system roles securely.
        </p>

    </div>

    <!-- STATS -->

    <div class="stats">

        <div class="stat-card">
            <h4>Total Users</h4>
            <div class="number"
                 th:text="${#lists.size(users)}">
            </div>
        </div>

        <div class="stat-card">
            <h4>System Roles</h4>
            <div class="number"
                 th:text="${#lists.size(roles)}">
            </div>
        </div>

        <div class="stat-card">
            <h4>Status</h4>
            <div class="number">Active</div>
        </div>

    </div>

    <!-- GRID -->

    <div class="grid">

        <!-- CREATE USER -->

        <div class="card">

            <h3>➕ Create User</h3>

            <form th:action="@{/admin/users/create}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <div class="form-group">

                    <label>Username</label>

                    <input type="text"
                           name="username"
                           placeholder="Enter username"
                           required/>

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input type="password"
                           name="password"
                           placeholder="Enter password"
                           required/>

                </div>

                <div class="form-group">

                    <label>Select Roles</label>

                    <select name="roles" multiple>

                        <option th:each="role : ${roles}"
                                th:value="${role.name}"
                                th:text="${role.name}">
                        </option>

                    </select>

                </div>

                <button type="submit">
                    Create User
                </button>

            </form>

        </div>

        <!-- USERS TABLE -->

        <div class="card">

            <h3>👥 Existing Users</h3>

            <div class="table-wrapper">

                <table>

                    <thead>

                    <tr>
                        <th>Username</th>
                        <th>Assigned Roles</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="user : ${users}">

                        <td th:text="${user.username}"></td>

                        <td class="roles">

                            <span th:each="role : ${user.roles}"
                                  th:text="${#strings.replace(role.name,'ROLE_','')}">
                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
