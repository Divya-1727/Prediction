<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carbon Prediction App</title>
    <style>
        body {
      margin: 0;
      font-family: Arial, sans-serif;

      /* 🧑‍💻 Eco-tech admin / digital sustainability vibe */
    background: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5ce?auto=format&fit=crop&w=1600&q=80');
      min-height: 100vh;
  }

  /* overlay for consistency */
  body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 40, 20, 0.70); /* slightly darker = admin/security feel */
      z-index: 0;
  }

  /* MAIN CONTAINER */
  .container {
      position: relative;
      z-index: 1;

      padding: 40px;
      text-align: center;
  }

  /* TITLE */
  .container h1 {
      color: #b9fbc0;
      margin-bottom: 25px;
  }

  /* GLASS CARDS */
  .card {
      width: 420px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);

      color: white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }

  /* INPUTS */
  input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;

      border: none;
      border-radius: 6px;

      outline: none;
  }

  /* BUTTON */
  button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;

      border: none;
      border-radius: 6px;

      background: #2ecc71;
      color: white;
      font-weight: bold;

      cursor: pointer;
      transition: 0.3s;
  }

  button:hover {
      background: #27ae60;
  }

  /* TABLE */
  table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
  }

  th, td {
      padding: 10px;
      text-align: center;
  }

  th {
      color: #b9fbc0;
      background: rgba(255,255,255,0.12);
  }

  td {
      background: rgba(255,255,255,0.05);
  }

  /* ROLE TAGS */
  .roles span {
      display: inline-block;
      margin: 2px;
      padding: 4px 8px;

      border-radius: 6px;
      background: rgba(46, 204, 113, 0.3);
      color: #eaffea;
      font-size: 12px;
  }




    </style>
</head>

<body>

<div class="container">



    <h1>🌿 User Management</h1>

    <div class="card">
        <form th:action="@{/admin/users/create}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <input type="text" name="username" placeholder="Username" required/>
            <input type="password" name="password" placeholder="Password" required/>

            <label>Select Roles:</label>
            <select name="roles" multiple>
                <option th:each="role : ${roles}"
                        th:value="${role.name}"
                        th:text="${role.name}">
                </option>
            </select>

            <button type="submit">Create User</button>
        </form>
    </div>

    <div class="card">
        <table>
            <tr>
                <th>Username</th>
                <th>Roles</th>
            </tr>

            <tr th:each="user : ${users}">
                <td th:text="${user.username}"></td>
                <td class="roles">
                    <span th:each="role : ${user.roles}"
                          th:text="${#strings.replace(role.name,'ROLE_','')}">
                    </span>
                </td>
            </tr>
        </table>
    </div>




</div>




</body>
</html>
