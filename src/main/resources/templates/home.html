<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carbon Prediction App</title>
    <style>
        /* ===== BODY ===== */
 body{
     margin:0;
     font-family:'Poppins',sans-serif;
     background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
     min-height:100vh;
     color:white;
 }

 /* ===== NAVBAR ===== */
 .nav{
     display:flex;
     justify-content:space-between;
     align-items:center;
     padding:15px 40px;
     background:rgba(0,0,0,0.4);
     backdrop-filter:blur(10px);
 }

 .nav h2{
     margin:0;
 }

 .nav-links a{
     color:white;
     text-decoration:none;
     margin-left:20px;
     transition:0.3s;
 }

 .nav-links a:hover{
     color:#00ff9d;
 }

 /* ===== MAIN CONTAINER ===== */
 .main-container{
     display:flex;
     justify-content:center;
     align-items:center;
     height:85vh;
 }

 /* ===== CARD ===== */
 .card{
     width:400px;
     padding:35px;
     border-radius:15px;
     background:rgba(255,255,255,0.08);
     backdrop-filter:blur(15px);
     box-shadow:0 0 12px rgba(0,255,150,0.3);
     animation:slideUp 1s ease;
 }

 /* ===== TITLE ===== */
 .card h2{
     text-align:center;
     margin-bottom:25px;
 }

 /* ===== INPUTS ===== */
 label{
     display:block;
     margin-top:15px;
     margin-bottom:5px;
 }

 input{
     width:100%;
     padding:12px;
     border-radius:8px;
     border:none;
     outline:none;
     background:rgba(255,255,255,0.15);
     color:white;
 }

 /* INPUT FOCUS */
 input:focus{
     box-shadow:0 0 10px #00ff9d;
 }

 /* ===== BUTTON ===== */
 button{
     width:100%;
     margin-top:25px;
     padding:12px;
     border:none;
     border-radius:8px;
     background:linear-gradient(45deg,#00e676,#00c853);
     color:white;
     font-size:16px;
     cursor:pointer;
     transition:0.3s;
 }

 button:hover{
     transform:scale(1.05);
     box-shadow:0 0 15px #00ff9d;
 }

 /* ===== ANIMATION ===== */
 @keyframes slideUp{
     from{
         opacity:0;
         transform:translateY(60px);
     }
     to{
         opacity:1;
     }
 }



    </style>
</head>
<body>
<nav class="nav">


<h2>🌱 CLEAN AND GREEN CARBON TRACKER</h2>


<div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/admin" class="nav-link">Admin Panel</a>
    <a href="/tips" class="nav-link">Carbon Tips</a>
    <a href="/login" class="nav-link">Log Out</a>
</div>

</nav>

<div class="main-container">

    <div class="card">

        <h2>🌱 CARBON EMISSION CALCULATOR </h2>



<form th:action="@{/create}" th:object="${energy}" method="post">
    <label>Electricity Consumed(KWh)⚡:</label>
    <input type="number" th:field="*{consumedElectricity}" required/> <br><br>

    <label>Petrol Consumed(litres)⛽:</label>
    <input type="number" th:field="*{consumedPetrol}" required/><br><br>

    <label>Wastage(Kg)🗑:</label>
    <input type="number" th:field="*{wastage}" required/><br><br>

    <button type="submit">Calculate</button>


</form>
    </div>
</div>


</body>
</html>
