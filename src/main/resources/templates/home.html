<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Carbon Prediction App</title>

    <style>
        body {
             margin: 0;
             font-family: Arial, sans-serif;


             background: url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1600&q=80')
                         no-repeat center center/cover;

             min-height: 100vh;
         }

         /* overlay like login page */
         body::before {
             content: "";
             position: fixed;
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
             background: rgba(0, 40, 20, 0.6);
             z-index: 0;
         }

         /* NAVBAR */
         .nav {
             position: relative;
             z-index: 1;
             display: flex;
             justify-content: space-between;
             align-items: center;
             padding: 15px 25px;

             background: rgba(255, 255, 255, 0.1);
             backdrop-filter: blur(10px);
             color: #d4ffd9;
         }

         .nav h2 {
             margin: 0;
             font-size: 18px;
             color: #b9fbc0;
         }

         .nav-links a {
             margin-left: 15px;
             text-decoration: none;
             color: #eaffea;
             font-weight: 500;
         }

         .nav-links a:hover {
             color: #a5ffcb;
         }

         /* MAIN CONTAINER */
        .main-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;   /* 🔥 THIS FIXES IT */
    align-items: center;
    margin-top: 40px;
}

         /* CARD STYLE (same as login theme) */
         .card {
             width: 380px;
             padding: 25px;
             border-radius: 12px;

             background: rgba(255, 255, 255, 0.12);
             backdrop-filter: blur(10px);

             color: #fff;
             box-shadow: 0 8px 25px rgba(0,0,0,0.3);
             text-align: center;
         }

         .card h2 {
             color: #b9fbc0;
             margin-bottom: 20px;
         }

         label {
             display: block;
             text-align: left;
             margin-top: 10px;
             font-size: 14px;
             color: #eaffea;
         }

         input {
             width: 95%;
             padding: 8px;
             margin-top: 5px;
             border: none;
             border-radius: 6px;
             outline: none;
         }

         button {
             width: 100%;
             margin-top: 15px;
             padding: 10px;
             border: none;
             border-radius: 6px;
             background: #2ecc71;
             color: white;
             font-weight: bold;
             cursor: pointer;
             transition: 0.3s;
         }

         button:hover {
             background: #27ae60;
         }
         /* ===== CHART SECTION ===== */
         .chart-container{
             width:80%;
             margin-top:40px;
             background:rgba(255,255,255,0.05);
             padding:20px;
             border-radius:12px;
         }

         /* ===== ANIMATION ===== */
         @keyframes slideUp{
             from{
                 opacity:0;
                 transform:translateY(60px);
             }
             to{
                 opacity:1;
             }
         }
    </style>
</head>

<body>

<nav class="nav">
    <h2>🌱 CLEAN AND GREEN CARBON TRACKER</h2>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/admin">Dashboard</a>
            <a href="/admin/users">Create User</a>


        <a href="#" onclick="document.getElementById('logoutForm').submit(); return false;">
            Logout
        </a>

        <form id="logoutForm" th:action="@{/logout}" method="post" style="display:none;">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
        </form>
    </div>
</nav>

<div class="main-container">

    <!-- ===== FORM CARD ===== -->
    <div class="card">
        <h2>🌱 CARBON EMISSION CALCULATOR</h2>

        <form th:action="@{/create}" th:object="${energy}" method="post">

            <label>Electricity Consumed (KWh) ⚡:</label>
            <input type="number" th:field="*{consumedElectricity}" required/>

            <label>Petrol Consumed (litres) ⛽:</label>
            <input type="number" th:field="*{consumedPetrol}" required/>

            <label>Wastage (Kg) 🗑:</label>
            <input type="number" th:field="*{wastage}" required/>

            <button type="submit">Calculate</button>

        </form>
    </div>

    <!-- ===== CHART SECTION ===== -->
    <div class="chart-container">
        <h3 style="text-align:center;">📊 Your Carbon Trend</h3>
        <canvas id="carbonChart"></canvas>
    </div>

</div>

<!-- ✅ SCRIPT AT BOTTOM (IMPORTANT) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    fetch('/trend')
      .then(res => res.json())
      .then(data => {

        if(!data || data.length === 0){
            console.log("No data for chart");
            return;
        }

        const labels = data.map(d =>
            new Date(d.date).toLocaleDateString()
        );

        const values = data.map(d => d.carbon);

        new Chart(document.getElementById('carbonChart'), {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Carbon Trend',
              data: values,
              borderWidth: 2,
              tension: 0.3
            }]
          }
        });
      })
      .catch(err => console.error("Chart Error:", err));
</script>

</body>
</html>
