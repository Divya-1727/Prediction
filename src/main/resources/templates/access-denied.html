<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access-Denied</title>

    <style>
        body {
      margin: 0;
      font-family: Arial, sans-serif;

      /* 🌿 Eco + admin style background */
     background: url('https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?auto=format&fit=crop&w=1600&q=80')
            no-repeat center center/cover;

      min-height: 100vh;
  }

  /* overlay (same theme) */
  body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 40, 20, 0.75); /* darker for denied feel */
      z-index: 0;
  }

  /* CENTERING */
  .container {
      position: relative;
      z-index: 1;

      display: flex;
      justify-content: center;
      align-items: center;

      height: 100vh;
  }

  /* GLASS CARD */
  .card {
      width: 350px;
      padding: 30px;
      border-radius: 14px;
 animation: fadeUp 0.5s ease;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);

      text-align: center;
      color: white;

      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
  }

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
    }
}


  /* TITLE */
  .card h2 {
      color: #ff6b6b; /* red warning */
      margin-bottom: 15px;
  }

  /* TEXT */
  .card p {
      color: #eaffea;
      margin-bottom: 20px;
  }

  /* BUTTON */
  .btn {
      display: inline-block;
      padding: 10px 15px;

      background: #2ecc71;
      color: white;
      text-decoration: none;
      border-radius: 6px;

      font-weight: bold;
      transition: 0.3s;
  }

  .btn:hover {
      background: #27ae60;
  }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🚫 Access Denied</h2>

        <p>You do not have permission to access the admin panel.</p>

        <a href="/" class="btn">⬅ Go back to home</a>
    </div>
</div>
</body>
</html>
