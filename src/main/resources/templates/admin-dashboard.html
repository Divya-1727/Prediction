<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
</head>
<body>

<h2>🛠 Admin Panel - Energy Records</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Electricity</th>
        <th>Petrol</th>
        <th>Waste</th>
        <th>Calculated Carbon</th>
        <th>Predicted Carbon</th>
        <th>Suggested Electricity</th>
        <th>Suggested Petrol</th>
        <th>Date</th>
        <th>Action</th> <!-- NEW -->
    </tr>

    <tr th:each="e : ${admin}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.electricityKwh}"></td>
        <td th:text="${e.petrolLiters}"></td>
        <td th:text="${e.wasteKg}"></td>
        <td th:text="${e.carbonFootprint}"></td>
        <td th:text="${e.predictedCarbon}"></td>
        <td th:text="${e.recommendedElectricity}"></td>
        <td th:text="${e.recommendedPetrol}"></td>
        <td th:text="${e.createdAt}"></td>

        <!-- Download Button -->
        <td>
            <a th:href="@{/admin/download/{id}(id=${e.id})}">
                <button>⬇ Download</button>
            </a>
        </td>
    </tr>

</table>

<br>
<a href="/admin/download">
    <button>⬇ Download Report (CSV)</button>
</a>
<a href="/"> Back to Dashboard</a>

</body>
</html>
