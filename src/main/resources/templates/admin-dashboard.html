<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Carbon Prediction Admin</title>

    <style>

       *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            background:
                linear-gradient(rgba(5,20,10,0.78), rgba(5,20,10,0.86)),
                url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop');
            background-size:cover;
            background-position:center;
            color:white;
            overflow-x:hidden;
        }

        /* SIDEBAR */

        .sidebar{
            width:260px;
            min-height:100vh;
            background:rgba(0,0,0,0.35);
            backdrop-filter:blur(14px);
            border-right:1px solid rgba(255,255,255,0.08);
            padding:30px 20px;
            position:fixed;
            left:0;
            top:0;
        }

        .sidebar h2{
            color:#b9ffbf;
            margin-bottom:40px;
            font-size:28px;
            text-align:center;
        }

        .sidebar a{
            display:block;
            text-decoration:none;
            color:white;
            padding:15px 18px;
            margin-bottom:15px;
            border-radius:14px;
            transition:0.3s;
            font-size:16px;
            background:rgba(255,255,255,0.03);
        }

        .sidebar a:hover{
            background:rgba(113,255,160,0.15);
            transform:translateX(5px);
            color:#8fffaf;
        }

        /* MAIN */

        .main{
            margin-left:260px;
            width:calc(100% - 260px);
            padding:30px;
        }

        /* TOPBAR */

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:35px;
            padding:20px 25px;
            background:rgba(255,255,255,0.07);
            backdrop-filter:blur(12px);
            border-radius:20px;
            border:1px solid rgba(255,255,255,0.08);
        }

        .topbar h1{
            font-size:34px;
            color:#d8ffdc;
        }

        .search-box input{
            padding:14px 18px;
            width:280px;
            border:none;
            outline:none;
            border-radius:12px;
            background:rgba(255,255,255,0.12);
            color:white;
            font-size:15px;
        }

        .search-box input::placeholder{
            color:#ddd;
        }

        /* CARDS */

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:25px;
            margin-bottom:35px;
        }

        .card{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            border-radius:20px;
            padding:28px;
            border:1px solid rgba(255,255,255,0.08);
            transition:0.4s;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 10px 25px rgba(0,0,0,0.35);
        }

        .card h3{
            color:#baffc6;
            margin-bottom:15px;
            font-size:18px;
        }

        .number{
            font-size:38px;
            font-weight:bold;
            color:white;
        }

        /* TABLE CARD */

        .table-card{
            background:rgba(255,255,255,0.07);
            backdrop-filter:blur(12px);
            border-radius:22px;
            padding:25px;
            border:1px solid rgba(255,255,255,0.08);
            overflow-x:auto;
        }

        .table-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .table-header h2{
            color:#c8ffd1;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        thead{
            background:rgba(255,255,255,0.08);
        }

        th{
            padding:18px;
            text-align:left;
            color:#b8ffcb;
            font-size:15px;
        }

        td{
            padding:18px;
            border-top:1px solid rgba(255,255,255,0.08);
            color:#f0f0f0;
            font-size:14px;
        }

        tbody tr{
            transition:0.3s;
        }

        tbody tr:hover{
            background:rgba(255,255,255,0.05);
        }

        /* BADGES */

        .badge{
            padding:8px 14px;
            border-radius:30px;
            font-size:13px;
            font-weight:600;
        }

        .high{
            background:#ff4d4d33;
            color:#ff8f8f;
        }

        .medium{
            background:#ffc10733;
            color:#ffd76a;
        }

        .low{
            background:#28a74533;
            color:#8fffaa;
        }

        /* BUTTON */

        .btn{
            text-decoration:none;
            display:inline-block;
            padding:10px 18px;
            border-radius:12px;
            background:linear-gradient(135deg,#69ff97,#15803d);
            color:white;
            font-weight:600;
            transition:0.3s;
        }

        .btn:hover{
            transform:scale(1.05);
            box-shadow:0 5px 15px rgba(0,0,0,0.3);
        }

        /* SCROLLBAR */

        ::-webkit-scrollbar{
            width:8px;
            height:8px;
        }

        ::-webkit-scrollbar-thumb{
            background:#58c777;
            border-radius:10px;
        }

        /* RESPONSIVE */

        @media(max-width:900px){

            .sidebar{
                width:100%;
                height:auto;
                position:relative;
                min-height:auto;
            }

            .main{
                margin-left:0;
                width:100%;
            }

            body{
                flex-direction:column;
            }

            .topbar{
                flex-direction:column;
                gap:20px;
                align-items:flex-start;
            }

            .search-box input{
                width:100%;
            }
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h2>Carbon Dashboard</h2>

    <a href="/admin">📊 Dashboard</a>

    <a href="/admin/users">➕ Create User</a>

    <a href="/">🏠 Home</a>

    <a href="/login">🚪 Logout</a>

</div>

<!-- MAIN -->

<div class="main">

    <!-- TOPBAR -->

    <div class="topbar">

        <h1> Dashboard</h1>

        <div class="search-box">

            <input type="text"
                   id="searchInput"
                   placeholder="Search records...">

        </div>

    </div>

    <!-- CARDS -->

    <div class="cards">

        <div class="card">
            <h3>Total Records</h3>
            <div class="number"
                 th:text="${#lists.size(admin)}">
            </div>
        </div>

        <div class="card">
            <h3>High Carbon Cases</h3>
            <div class="number" th:text="${highCarbonCases}">
                0
            </div>
        </div>

        <div class="card">
            <h3>Predictions Generated</h3>
            <div class="number" th:text="${totalPredictions}">
                0
            </div>
        </div>

        <div class="card">
            <h3>System Status</h3>
            <div class="number">
                Active
            </div>
        </div>

    </div>

    <!-- TABLE -->

    <div class="table-card">

        <div class="table-header">

            <h2>Energy Records</h2>

        </div>

        <table id="energyTable">

            <thead>

            <tr>
                <th>ID</th>
                <th>Electricity</th>
                <th>Petrol</th>
                <th>Waste</th>
                <th>Actual Carbon</th>
                <th>Predicted Carbon</th>
                <th>Status</th>
                <th>Download</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="e : ${admin}">

                <td th:text="${e.id}"></td>

                <td th:text="${e.consumedElectricity}"></td>

                <td th:text="${e.consumedPetrol}"></td>

                <td th:text="${e.wastage}"></td>

                <td th:text="${e.actualCarbon}"></td>

                <td th:text="${e.predictedCarbon}"></td>

                <!-- STATUS -->

                <td>

                    <span th:if="${e.predictedCarbon > 80}"
                          class="badge high">
                          High
                    </span>

                    <span th:if="${e.predictedCarbon <= 80 and e.predictedCarbon > 40}"
                          class="badge medium">
                          Medium
                    </span>

                    <span th:if="${e.predictedCarbon <= 40}"
                          class="badge low">
                          Low
                    </span>

                </td>

                <!-- DOWNLOAD -->

                <td>

                    <a th:href="@{/download/{id}(id=${e.id})}"
                       class="btn download-btn">

                        ⬇ Download

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- SEARCH SCRIPT -->

<script>

    const searchInput =
        document.getElementById("searchInput");

    searchInput.addEventListener("keyup", function () {

        let filter =
            searchInput.value.toLowerCase();

        let rows =
            document.querySelectorAll("#energyTable tbody tr");

        rows.forEach(row => {

            let text =
                row.innerText.toLowerCase();

            row.style.display =
                text.includes(filter)
                ? ""
                : "none";
        });
    });

</script>

</body>
</html>
