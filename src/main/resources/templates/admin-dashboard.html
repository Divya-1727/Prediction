<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
       margin: 0;
       font-family: Arial, sans-serif;

       /* 🌄 Different but matching green/nature background */
     background: url('https://images.unsplash.com/photo-1472145246862-b24cf25c4a36?auto=format&fit=crop&w=1600&q=80')
            no-repeat center center/cover;

       min-height: 100vh;
   }

   /* overlay (same theme consistency) */
   body::before {
       content: "";
       position: fixed;
       inset: 0;
       background: rgba(0, 40, 20, 0.72);
       z-index: 0;
   }

   /* MAIN CONTAINER */
   .admin-container {
       position: relative;
       z-index: 1;
       padding: 40px;
       text-align: center;
   }

   /* TITLE */
   .title {
       color: #b9fbc0;
       margin-bottom: 25px;
   }

   /* GLASS CARD */
   .table-card {
       width: 95%;
       margin: auto;
       padding: 25px;
       border-radius: 14px;
overflow-x: auto;
       background: rgba(255, 255, 255, 0.12);
       backdrop-filter: blur(12px);

       color: white;
       box-shadow: 0 8px 25px rgba(0,0,0,0.3);
   }

   /* TABLE */
   table {
       width: 100%;
       border-collapse: collapse;
       margin-top: 15px;
       font-size: 14px;
   }

   th, td {
       padding: 10px;
       text-align: center;
   }

   /* HEADER */
   th {
       background: rgba(255,255,255,0.15);
       color: #b9fbc0;
   }

   /* ROWS */
   td {
       background: rgba(255,255,255,0.05);
   }

   /* hover effect */
   tr:hover td {
       background: rgba(255,255,255,0.12);
       transition: 0.3s;
   }

   /* BUTTON */
   button {
       padding: 6px 10px;
       border: none;
       border-radius: 6px;

       background: #2ecc71;
       color: white;
       font-weight: bold;
       cursor: pointer;

       transition: 0.3s;
   }

   button:hover {
       background: #27ae60;
   }

   /* BACK BUTTON */
   .back-btn {
       display: inline-block;
       margin-top: 20px;
       padding: 10px 15px;

       background: #2ecc71;
       color: white;
       text-decoration: none;
       border-radius: 6px;

       transition: 0.3s;
   }

   .back-btn:hover {
       background: #27ae60;
   }

    </style>
</head>
<body>


<div class="admin-container">

    <h1 class="title">🌱 Carbon Prediction Admin Panel 🛠</h1>

    <div class="table-card">

        <h2>Energy Records</h2>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Electricity</th>
                <th>Petrol</th>
                <th>Waste</th>
                <th>Calculated Carbon</th>
                <th>Predicted Carbon</th>
                <th>Suggested Electricity</th>
                <th>Suggested Petrol</th>
                <th>Action</th>
            </tr>
            </thead>

            <tr th:each="e : ${admin}">
                <td th:text="${e.id}"></td>
                <td th:text="${e.consumedElectricity}"></td>
                <td th:text="${e.consumedPetrol}"></td>
                <td th:text="${e.wastage}"></td>
                <td th:text="${e.actualCarbon}"></td>
                <td th:text="${e.predictedCarbon}"></td>
                <td th:text="${e.suggestedElectricity}"></td>
                <td th:text="${e.suggestedPetrol}"></td>


                <td>
                    <a th:href="@{/admin/download/{id}(id=${e.id})}">
                        <button>⬇ Download</button>
                    </a>
                </td>

            </tr>


        </table>

        <a href="/" class="back-btn">⬅ Back to Dashboard</a>

    </div>



</div>

</body>
</html>
