<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>carbon analysis </title>
    <style>
        body {
           font-family: 'Segoe UI', sans-serif;
           background: linear-gradient(to right, #1f4037, #99f2c8);
           height:100vh;
           margin: 0;
    min-height: 100vh;
       }

       h2 {
           text-align: center;
           color: white;
           margin-top: 40px;
       }



       p {
           font-size: 16px;
           margin: 8px 0;
           color: #333;
       }

       b {
           font-size: 18px;
           color: #000;
       }



       .btn {
           display: block;
           padding: 12px;
           margin-top: 20px;
           background: #2ecc71;
           color: white;
           text-decoration: none;
           border-radius: 8px;
           font-weight: bold;
           transition: 0.3s;
       }

       .btn:hover {
           background:#27ae60;

       }


       @Keyframes fadeIn{
       from{
       opacity:0;
       transform:translateY(20px);
       }

       to{
       opacity:1;
       transform:translateY(0);
       }
       }


        .navbar{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:15px 40px;
        background:rgba(0,0,0,0.3);
        color:white;
        backdrop-filter:blur(8px);
        }



        .nav-link{
        text-decoration:none;
        color:white;
        transition:0.3s;
        margin-left:20px

        }


        .nav-link:hover{
        color:#00ffb3;
        }


        .report-container{
        display:flex;
        justify-content:center;
        align-items:center;
        height:80vh;
        margin-top:30px;
        }


        .report-card{
          background:rgba(255,255,255,0.015);
     backdrop-filter:blur(10px);
        padding:35px;
        border-radius:12px;
        width:400px;
         text-align: center;
        color:white;
        box-shadow:0 8px 25px rgba(0,0,0,0.2);
        animation:fadeIn 0.8s ease;
        }


        .report-card h1{
        margin:10px;
        font-weight:600;
        letter-spacing:0.5px;
        }


        .report-box{
        margin:15px 0;
        padding:18px;
        border-radius:8px;
        background:rgba(255,255,255,0.25);
        transition:0.3s;
        }


        .report-box:hover{
        transform:scale(1.03);

        }

        .blue{
        border-left:5px solid #4facfe;
        }

        .orange{
         border-left:5px solid orange;
        }

        .green{
         border-left:5px solid #00ffb3;
        }


    </style>
</head>
<body>

<header class="navbar">

    <h2>🌱 CLEAN AND GREEN CARBON TRACKER</h2>

<nav>
    <a href="/" class="nav-link">Home</a>
    <a href="/admin" class="nav-link">Admin Panel</a>
    <a href="/tips" class="nav-link">Carbon Tips</a>
    <a href="/login" class="nav-link">Log Out</a>

</nav>
</header>

    <div class="report-container">
        <div class="report-card">
        <h1>🌍 Carbon Analysis Report</h1>


    <div class="report-box blue">
        <p>Total Calculated Carbon:</p>
        <b th:text="${energy.actualCarbon}"></b>
    </div>

    <div class="report-box orange">
        <p>Total Predicted Carbon:</p>
        <b th:text="${energy.predictedCarbon}"></b>
    </div>

    <div class="report-box green">
        <p>⚡ Suggested Electricity:</p>
        <b th:text="${energy.suggestedElectricity}"></b>

        <p>⛽ Suggested Petrol:</p>
        <b th:text="${energy.suggestedPetrol}"></b>
    </div>

    <a href="/" class="btn">⬅ Back to Home</a>

</div>
    </div>
</body>
</html>
