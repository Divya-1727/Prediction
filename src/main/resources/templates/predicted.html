<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>carbon analysis </title>
    <style>
        body {
      margin: 0;
      font-family: Arial, sans-serif;

      background: url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1600&q=80')
                  no-repeat center center/cover;

      min-height: 100vh;
  }

  /* overlay */
  body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 40, 20, 0.6);
      z-index: 0;
  }

  /* NAVBAR (same as dashboard) */
  .navbar {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;

      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
  }

  .navbar h2 {
      margin: 0;
      color: #b9fbc0;
  }

  .nav-link {
      margin-left: 15px;
      text-decoration: none;
      color: #eaffea;
      font-weight: 500;
  }

  .nav-link:hover {
      color: #a5ffcb;
  }

  /* MAIN CONTAINER */
  .report-container {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      margin-top: 50px;
  }

  /* GLASS CARD */
  .report-card {
      width: 420px;
      padding: 30px;
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);

      color: white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      text-align: center;
  }


.report-card {
    animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
    }
}

  /* TITLE */
  .report-card h1 {
      color: #b9fbc0;
      margin-bottom: 20px;
  }



  /* REPORT BOXES */
  .report-box {
      margin: 15px 0;
      padding: 15px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
  }

  .report-box p {
      margin: 5px 0;
      font-size: 14px;
  }

  .report-box b {
      font-size: 18px;
  }

  /* subtle color accents */
  .blue { border-left: 4px solid #3498db; }
  .orange { border-left: 4px solid #f39c12; }
  .green { border-left: 4px solid #2ecc71; }

  /* BUTTONS */
  .btn {
      display: block;
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;

      background: #2ecc71;
      color: white;
      text-decoration: none;
      font-weight: bold;

      transition: 0.3s;
  }

  .btn:hover {
      background: #27ae60;
  }


    </style>
</head>
<body>

<header class="navbar">

    <h2>🌱 CLEAN AND GREEN CARBON TRACKER</h2>

<nav>
    <a href="/" class="nav-link">Home</a>
    <a href="/admin" class="nav-link">Dashboard</a>
    <a href="/login" class="nav-link">Log Out</a>

</nav>
</header>

    <div class="report-container">
        <div class="report-card">
        <h1>🌍 Carbon Analysis Report</h1>


    <div class="report-box blue">
        <p>Total Calculated Carbon:</p>
        <b th:text="${energy.actualCarbon}"></b>
    </div>

    <div class="report-box orange">
        <p>Total Predicted Carbon:</p>
        <b th:text="${energy.predictedCarbon}"></b>
    </div>

    <div class="report-box green">
        <p>⚡ Suggested Electricity:</p>
        <b th:text="${energy.suggestedElectricity}"></b>

        <p>⛽ Suggested Petrol:</p>
        <b th:text="${energy.suggestedPetrol}"></b>
    </div>

    <a href="/tips" class="btn">Tips</a>

    <a href="/" class="btn">⬅ Back to Home</a>

</div>
    </div>
</body>
</html>
